services:
  postgres:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: ./ninePjtBack
    env_file: .env
    volumes:
      - ./data/media:/app/media
      - ./data/staticfiles:/app/staticfiles
    depends_on:
      - postgres
    restart: unless-stopped

  frontend:
    build:
      context: ./ninePjtFront
      args:
        VITE_API_BASE_URL: https://nine015.iptime.org
    volumes:
      - frontend_dist:/usr/share/nginx/html
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.https.conf:/etc/nginx/conf.d/default.conf
      - frontend_dist:/usr/share/nginx/html
      - ./data/staticfiles:/staticfiles
      - ./data/media:/media
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    # 인증서 갱신: docker compose -f docker-compose.https.yml run --rm certbot renew

volumes:
  frontend_dist:
