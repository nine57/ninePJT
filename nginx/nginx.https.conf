# HTTP → HTTPS 리다이렉트 + certbot challenge
server {
    listen 80;
    server_name nine015.iptime.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 메인 설정
server {
    listen 443 ssl;
    server_name nine015.iptime.org;

    ssl_certificate /etc/letsencrypt/live/nine015.iptime.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nine015.iptime.org/privkey.pem;

    # Frontend SPA
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API proxy
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Media files
    location /media/ {
        alias /media/;
    }

    # Static files
    location /static/ {
        alias /staticfiles/;
    }
}
