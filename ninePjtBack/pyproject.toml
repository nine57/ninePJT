[project]
name = "ninepjtback"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=4.2.26,<4.3",
    "django-ninja>=1.3.0",
    "PyJWT>=2.8.0",
    "pillow>=12.0.0",
    "google-genai>=1.56.0",
    "urllib3>=2.6.0",
    "python-dotenv>=1.0.1",
    "django-extensions>=3.2.3",
    "gunicorn>=21.2.0",
    "django-cors-headers>=4.9.0",
    "slack-sdk>=3.27.0",
    "psycopg2-binary>=2.9.9",
]

[dependency-groups]
dev = [
    "black==25.12.0",
    "isort==7.0.0",
    "ruff==0.14.10",
]

[tool.black]
target-version = ["py312"]
line-length = 100
include = '\\.(py|pyi)$'
exclude = '(\.venv|venv|migrations)/'

[tool.isort]
profile = "black"
line_length = 100
src_paths = ["."]
default_section = "THIRDPARTY"
known_first_party = ["config", "core"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "venv", "**/migrations/*"]

[tool.ruff.lint]
extend-select = ["I"]
